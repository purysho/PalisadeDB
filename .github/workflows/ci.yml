name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q .

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build executable
        shell: powershell
        run: .\build-windows.ps1
      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path 'dist\PalisadeDB.exe')) { throw 'Executable was not created' }
          $size = (Get-Item 'dist\PalisadeDB.exe').Length
          if ($size -lt 1000000) { throw "Executable looks unexpectedly small: $size bytes" }
          Write-Host "Verified dist\PalisadeDB.exe ($size bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: PalisadeDB-windows
          path: dist/PalisadeDB.exe
          if-no-files-found: error

  package:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      APP: PalisadeDB
      ENTRY: palisadedb_desktop.pyw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pyinstaller pillow
          if [ -f tools/make_icon.py ]; then python tools/make_icon.py; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            icon=()
            for f in assets/icon.png assets/icon.ico; do
              if [ -f "$f" ]; then icon=(--icon "$f"); break; fi
            done
            python -m PyInstaller --noconfirm --clean --windowed --name "$APP" "${icon[@]}" "$ENTRY"
            test -d "dist/$APP.app"
            .github/scripts/launch-check.sh "dist/$APP.app/Contents/MacOS/$APP"
          else
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name "$APP" "$ENTRY"
            test -x "dist/$APP"
            .github/scripts/launch-check.sh "dist/$APP"
          fi
