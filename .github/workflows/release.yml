# Code signing is optional and switches on by itself once these repository
# secrets exist (Settings -> Secrets and variables -> Actions):
#   Windows (Azure Artifact Signing): AZURE_TENANT_ID, AZURE_CLIENT_ID,
#     AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#     AZURE_CERT_PROFILE
#   macOS (Developer ID + notarization): APPLE_CERT_P12, APPLE_CERT_PASSWORD,
#     APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
# Without them, builds are published unsigned, as before.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (for example v1.0.0)'
        required: true

permissions:
  contents: write

env:
  APP: PalisadeDB
  ENTRY: palisadedb_desktop.pyw
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        shell: powershell
        run: .\build-windows.ps1
      - name: Verify and name executable
        shell: powershell
        run: |
          $exe = "dist\$env:APP.exe"
          if (!(Test-Path $exe)) { throw "$exe was not built" }
          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) { throw "$exe looks unexpectedly small: $size bytes" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe "out\$env:APP-Windows-x64.exe"
      - name: Sign Windows executable
        # Runs only once the Artifact Signing secrets exist; see the header of this file.
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  unix:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macOS-arm64
          - os: ubuntu-22.04
            platform: Linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pyinstaller pillow
          if [ -f tools/make_icon.py ]; then python tools/make_icon.py; fi
          mkdir -p out
          if [ "$RUNNER_OS" = "macOS" ]; then
            icon=()
            for f in assets/icon.png assets/icon.ico; do
              if [ -f "$f" ]; then icon=(--icon "$f"); break; fi
            done
            python -m PyInstaller --noconfirm --clean --windowed --name "$APP" "${icon[@]}" "$ENTRY"
            test -d "dist/$APP.app"
            .github/scripts/sign-macos.sh "dist/$APP.app"
            ditto -c -k --keepParent "dist/$APP.app" "out/$APP-${{ matrix.platform }}.zip"
          else
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name "$APP" "$ENTRY"
            test -x "dist/$APP"
            tar -C dist -czf "out/$APP-${{ matrix.platform }}.tar.gz" "$APP"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [windows, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ## Download

            | Platform | File |
            |---|---|
            | Windows 10/11 (x64) | `${{ env.APP }}-Windows-x64.exe` — portable, no installer |
            | macOS (Apple Silicon) | `${{ env.APP }}-macOS-arm64.zip` — unzip and move to Applications |
            | Linux (x86_64) | `${{ env.APP }}-Linux-x86_64.tar.gz` — extract and run `./${{ env.APP }}` |

            These builds are not yet code-signed. On first launch, Windows SmartScreen may ask you to confirm ("More info" → "Run anyway"), and macOS may block the app until you Control-click it and choose **Open**. Verify a download against `SHA256SUMS.txt` if you want an independent integrity check.
          files: out/*
