name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (for example v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        shell: powershell
        run: .\build-windows.ps1
      - name: Smoke check executable
        shell: powershell
        run: |
          if (!(Test-Path 'dist\PalisadeDB.exe')) { throw 'PalisadeDB.exe was not built' }
          if ((Get-Item 'dist\PalisadeDB.exe').Length -le 0) { throw 'PalisadeDB.exe is empty' }
      - name: Create checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash 'dist\PalisadeDB.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  PalisadeDB.exe" | Out-File -Encoding ascii 'dist\PalisadeDB.exe.sha256'
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/PalisadeDB.exe
            dist/PalisadeDB.exe.sha256
